name: Build vm-sandbox rootfs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootfs-${{ github.workflow }}-amd64-trixie-vm-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/rootfs-build.yml
    with:
      target: amd64-trixie-vm-sandbox
