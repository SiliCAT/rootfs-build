name: Build one rootfs target

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      platform: ${{ steps.target.outputs.platform }}
      builder_image: ${{ steps.target.outputs.builder_image }}
      artifact_name: ${{ steps.target.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve registered target
        id: target
        env:
          TARGET_ID: ${{ inputs.target }}
        run: python3 scripts/target.py resolve "$TARGET_ID" --github-output "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TARGET_ID: ${{ inputs.target }}
      BUILDER_IMAGE: ${{ needs.resolve.outputs.builder_image }}
      BUILDER_PLATFORM: ${{ needs.resolve.outputs.platform }}
      CONTAINER_NAME: rootfs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare runner directories and pull builder
        env:
          STATE_DIRECTORY: ${{ runner.temp }}/rootfs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "STATE_DIRECTORY=$STATE_DIRECTORY" >> "$GITHUB_ENV"
          mkdir -p "$STATE_DIRECTORY/logs" "$STATE_DIRECTORY/output" "$STATE_DIRECTORY/work"
          docker pull --platform "$BUILDER_PLATFORM" "$BUILDER_IMAGE" 2>&1 | tee "$STATE_DIRECTORY/logs/pull.log"
          df -h "$STATE_DIRECTORY" | tee "$STATE_DIRECTORY/logs/disk.log"
          free -h | tee "$STATE_DIRECTORY/logs/memory.log"
      - name: Prepare builder and build rootfs
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # Affinity limits both DKMS nproc-based builds and compression workers.
          cpus=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')
          docker run --init --privileged --name "$CONTAINER_NAME" \
            --platform "$BUILDER_PLATFORM" --cpuset-cpus "$cpus" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work,readonly" \
            --mount "type=bind,src=$STATE_DIRECTORY,dst=/build" \
            --workdir /work \
            --env SOURCE_COMMIT --env SOURCE_REPOSITORY --env SOURCE_REF --env WORKFLOW_RUN_URL \
            "$BUILDER_IMAGE" bash -c \
            'scripts/prepare-builder.sh && python3 -m unittest discover -s tests -v && exec scripts/run-target.sh "$1" /build' \
            rootfs-job "$TARGET_ID" 2>&1 | tee "$STATE_DIRECTORY/logs/workflow.log"
      - name: Stop builder and export diagnostics
        if: always()
        run: |
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true ]; then
              docker stop --time 30 "$CONTAINER_NAME"
            fi
            docker rm --force "$CONTAINER_NAME"
          fi
          if [ -d "$STATE_DIRECTORY" ]; then
            sudo -n python3 scripts/target.py diagnostics "$STATE_DIRECTORY"
          fi
      - name: Upload rootfs and build records
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.STATE_DIRECTORY }}/output/*.tar.zst
            ${{ env.STATE_DIRECTORY }}/output/*.sha256
            ${{ env.STATE_DIRECTORY }}/output/*.packages.tsv
            ${{ env.STATE_DIRECTORY }}/output/*.build.json
            ${{ env.STATE_DIRECTORY }}/output/*.SHA256SUMS
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-${{ needs.resolve.outputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ env.STATE_DIRECTORY }}/logs/
