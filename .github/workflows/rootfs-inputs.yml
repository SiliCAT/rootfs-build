name: List rootfs inputs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  list-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Find eligible base rootfs artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/transform.py list-inputs --repository "$SOURCE_REPOSITORY" \
            --summary "$GITHUB_STEP_SUMMARY"
